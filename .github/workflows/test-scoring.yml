name: Scoring regression tests (v2 frozen)

on:
  push:
    paths:
      - "config/**"
      - "scoring/**"
      - "tests/**"
      - ".github/workflows/test-scoring.yml"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: pip install pytest
      - name: Run scoring regression tests
        run: pytest tests/test_scoring.py -v
