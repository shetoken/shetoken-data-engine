name: SHEtoken Weekly WEI Agent

on:
  schedule:
    - cron: '0 6 * * 0'   # Every Sunday 6am UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — skip email, Sheets and social posts'
        type: boolean
        default: false
      no_dedup:
        description: 'Skip dedup — full article set, nothing written to seen-URLs (safe for re-runs)'
        type: boolean
        default: false
      days_back:
        description: 'How many days back to fetch articles (default 7)'
        type: number
        default: 7

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # Pin the Ollama model directory so cache + server + pulls all agree on it.
    env:
      OLLAMA_MODELS: /home/runner/.ollama/models

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install weasyprint system dependencies
        run: sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libcairo2 libgdk-pixbuf2.0-0

      - name: Install dependencies
        run: pip install -r agent/requirements.txt

      # ── NEW: restore cached Ollama models (skips the 4 GB download on hits) ──
      - name: Cache Ollama models
        id: cache-ollama
        uses: actions/cache@v4
        with:
          path: /home/runner/.ollama/models
          key: ollama-models-phi3.5-qwen2.5-3b-v1
      # ─────────────────────────────────────────────────────────────────────────

      - name: Install & start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          # Stop the auto-started systemd service so OUR server (with the pinned
          # OLLAMA_MODELS path) is the one that answers — keeps the cache valid.
          sudo systemctl stop ollama 2>/dev/null || true
          mkdir -p "$OLLAMA_MODELS"
          ollama serve &
          sleep 10

      # ── NEW: only pull when the cache missed (first run, or after a key bump) ─
      - name: Pull models (cache miss only)
        if: steps.cache-ollama.outputs.cache-hit != 'true'
        run: |
          echo "Cache miss — downloading models..."
          ollama pull phi3.5
          ollama pull qwen2.5:3b

      - name: Confirm models present
        run: ollama list
      # ─────────────────────────────────────────────────────────────────────────

      - name: Run WEI agent
        env:
          GMAIL_USER:           ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:   ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_TO_EMAIL:      ${{ secrets.REPORT_TO_EMAIL }}
          YOUTUBE_API_KEY:      ${{ secrets.YOUTUBE_API_KEY }}
          GOOGLE_SHEET_ID:      ${{ secrets.GOOGLE_SHEET_ID }}
          NEWSLETTER_SUBSCRIBERS: ${{ secrets.NEWSLETTER_SUBSCRIBERS }}
          OLLAMA_HOST:          http://localhost:11434
          ANALYTICS_BACKEND:    memory
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd agent
          python run_agent.py \
            ${{ inputs.dry_run  == true && '--dry-run'  || '' }} \
            ${{ inputs.no_dedup == true && '--no-dedup' || '' }} \
            --days-back ${{ inputs.days_back || 7 }}

      # ── Load this week's live scores into Supabase (same job, files on disk) ──
      - name: Install Supabase loader deps
        run: pip install supabase pandas python-dotenv

      - name: Load weekly live scores to Supabase
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python pipeline/load_live_to_supabase.py
      # ─────────────────────────────────────────────────────────────────────────

      - name: Commit updated live scores
        run: |
          git config user.name  "SHEtoken Agent"
          git config user.email "agent@shetoken.org"
          git add agent/output/live/ || true
          git diff --staged --quiet || git commit -m "Weekly WEI live scores update $(date -u +%Y-W%V)"
          git push || true
