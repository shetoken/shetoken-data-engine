name: SHEtoken WEI Agent

on:
  # Manual trigger — click "Run workflow" in the Actions tab
  workflow_dispatch:
    inputs:
      days_back:
        description: "Days of news to scan (default 7)"
        required: false
        default: "7"
      dry_run:
        description: "Dry run — skip email/Sheets/social"
        type: boolean
        required: false
        default: false

  # Automatic weekly run — every Monday 06:00 UTC
  schedule:
    - cron: "0 6 * * 1"

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r agent/requirements.txt

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 5
          ollama pull phi3.5
          ollama pull qwen2.5:3b

      - name: Run WEI agent
        env:
          # ── Classification ────────────────────────────────────────────────
          ANTHROPIC_API_KEY:        ${{ secrets.ANTHROPIC_API_KEY }}
          CLASSIFY_TIMEOUT_SECS:    "600"

          # ── Data sources ──────────────────────────────────────────────────
          NCBI_API_KEY:             ${{ secrets.NCBI_API_KEY }}
          YOUTUBE_API_KEY:          ${{ secrets.YOUTUBE_API_KEY }}
          REDDIT_CLIENT_ID:         ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET:     ${{ secrets.REDDIT_CLIENT_SECRET }}

          # ── Outputs ───────────────────────────────────────────────────────
          GMAIL_USER:               ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:       ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_TO_EMAIL:          ${{ secrets.REPORT_TO_EMAIL }}
          GOOGLE_SHEET_ID:          ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SUPABASE_URL:             ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

        run: |
          cd agent
          ARGS="--days-back ${{ inputs.days_back || '7' }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python run_agent.py $ARGS
